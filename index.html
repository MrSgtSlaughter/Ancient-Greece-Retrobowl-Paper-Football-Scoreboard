<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancient Greece Paper Football Review - Wars & Culture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: #000;
            min-height: 100vh;
            padding: 10px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .game-container {
            max-width: 1400px;
            margin: 0 auto;
            background: #222;
            border: 8px solid #00ff00;
            box-shadow: 0 0 30px #00ff00, inset 0 0 20px rgba(0,255,0,0.2);
            position: relative;
        }

        /* Scanline effect */
        .game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.3) 2px,
                rgba(0,0,0,0.3) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .header {
            background: linear-gradient(180deg, #1a1a4e 0%, #0d0d2b 100%);
            color: #00ff00;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #00ff00;
            position: relative;
        }

        .header h1 {
            font-size: 1.5em;
            text-shadow: 3px 3px 0px #ff00ff, 5px 5px 0px #00ffff;
            margin-bottom: 15px;
            letter-spacing: 2px;
            animation: titleGlow 2s infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 3px 3px 0px #ff00ff, 5px 5px 0px #00ffff; }
            to { text-shadow: 3px 3px 10px #ff00ff, 5px 5px 10px #00ffff; }
        }

        .header p {
            font-size: 0.6em;
            color: #ffff00;
            text-shadow: 2px 2px 0px #ff0000;
        }

        /* Pixel Art Crowd */
        .crowd {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: #1a1a1a;
            border-bottom: 4px solid #00ff00;
            gap: 10px;
        }

        .crowd-section {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
        }

        .fan {
            width: 8px;
            height: 16px;
            background: #ff0000;
            animation: pixelCheer 1.5s infinite;
            image-rendering: pixelated;
        }

        .fan:nth-child(1) { background: #ff0000; animation-delay: 0s; }
        .fan:nth-child(2) { background: #0000ff; animation-delay: 0.2s; }
        .fan:nth-child(3) { background: #ffff00; animation-delay: 0.4s; }
        .fan:nth-child(4) { background: #00ff00; animation-delay: 0.6s; }
        .fan:nth-child(5) { background: #ff00ff; animation-delay: 0.8s; }
        .fan:nth-child(6) { background: #00ffff; animation-delay: 1s; }
        .fan:nth-child(7) { background: #ff8800; animation-delay: 1.2s; }
        .fan:nth-child(8) { background: #8800ff; animation-delay: 1.4s; }

        @keyframes pixelCheer {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(-8px) scaleY(1.2); }
        }

        /* Scoreboard */
        .scoreboard {
            background: linear-gradient(180deg, #000080 0%, #000040 100%);
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center;
            border-bottom: 4px solid #ffff00;
        }

        .player-setup {
            text-align: center;
        }

        .player-setup input {
            width: 100%;
            padding: 10px;
            font-size: 0.6em;
            font-family: 'Press Start 2P', cursive;
            border: 4px solid #00ff00;
            background: #000;
            color: #00ff00;
            text-align: center;
            margin-bottom: 10px;
            box-shadow: 0 0 10px #00ff00;
        }

        .player-setup input:focus {
            outline: none;
            box-shadow: 0 0 20px #00ff00;
        }

        .score-display {
            background: #000;
            padding: 15px;
            border: 4px solid #ffff00;
            box-shadow: 0 0 15px #ffff00;
        }

        .player-name {
            color: #ffff00;
            font-size: 0.6em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #ff0000;
        }

        .score {
            color: #00ff00;
            font-size: 2em;
            text-shadow: 3px 3px 0px #008800;
            animation: scorePulse 1s infinite;
        }

        @keyframes scorePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .vs {
            color: #ff00ff;
            font-size: 1.5em;
            text-shadow: 3px 3px 0px #880088;
            animation: vsFlash 1s infinite;
        }

        @keyframes vsFlash {
            0%, 100% { color: #ff00ff; }
            50% { color: #ffff00; }
        }

        /* Video Modal */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .video-modal.active {
            display: flex;
        }

        .video-modal video {
            max-width: 90%;
            max-height: 90%;
            border: 8px solid #00ff00;
            box-shadow: 0 0 50px #00ff00;
        }

        /* Football Field */
        .field {
            background: linear-gradient(to right,
                #0a5f0a 0%, #0a5f0a 10%,
                #0d7a0d 10%, #0d7a0d 20%,
                #0a5f0a 20%, #0a5f0a 30%,
                #0d7a0d 30%, #0d7a0d 40%,
                #0a5f0a 40%, #0a5f0a 50%,
                #0d7a0d 50%, #0d7a0d 60%,
                #0a5f0a 60%, #0a5f0a 70%,
                #0d7a0d 70%, #0d7a0d 80%,
                #0a5f0a 80%, #0a5f0a 90%,
                #0d7a0d 90%, #0d7a0d 100%
            );
            padding: 30px;
            min-height: 150px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 4px solid #ffff00;
        }

        .football {
            font-size: 3em;
            animation: pixelBounce 1s infinite;
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.8));
        }

        @keyframes pixelBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-15px) rotate(90deg); }
            50% { transform: translateY(-25px) rotate(180deg); }
            75% { transform: translateY(-15px) rotate(270deg); }
        }

        /* Score Buttons */
        .score-buttons-container {
            background: #1a1a1a;
            padding: 20px;
        }

        .scoring-instruction {
            text-align: center;
            font-size: 0.6em;
            color: #ffff00;
            margin-bottom: 20px;
            padding: 15px;
            background: #000;
            border: 4px solid #ffff00;
            text-shadow: 2px 2px 0px #ff0000;
            box-shadow: 0 0 15px #ffff00;
        }

        .score-buttons-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .player-scoring-section {
            background: #000;
            padding: 15px;
            border: 4px solid #00ff00;
            box-shadow: 0 0 15px #00ff00;
        }

        .player-scoring-section h3 {
            text-align: center;
            color: #00ffff;
            margin-bottom: 15px;
            font-size: 0.7em;
            text-shadow: 2px 2px 0px #008888;
        }

        .player-score-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .score-btn {
            padding: 15px;
            font-size: 0.6em;
            font-family: 'Press Start 2P', cursive;
            border: 4px solid;
            cursor: pointer;
            transition: all 0.1s;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.8);
            position: relative;
        }

        .score-btn:active {
            transform: translate(2px, 2px);
        }

        .touchdown-btn {
            background: #ff0000;
            color: #fff;
            border-color: #880000;
            box-shadow: 0 4px 0 #880000, 0 0 10px #ff0000;
        }

        .touchdown-btn:hover {
            background: #ff4444;
            box-shadow: 0 4px 0 #880000, 0 0 20px #ff0000;
        }

        .extra-point-btn {
            background: #00ff00;
            color: #000;
            border-color: #008800;
            box-shadow: 0 4px 0 #008800, 0 0 10px #00ff00;
        }

        .extra-point-btn:hover {
            background: #44ff44;
            box-shadow: 0 4px 0 #008800, 0 0 20px #00ff00;
        }

        /* Question Section */
        .question-section {
            padding: 20px;
            background: #000;
        }

        .question-btn {
            width: 100%;
            padding: 20px;
            font-size: 0.8em;
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(180deg, #ff00ff 0%, #880088 100%);
            color: #fff;
            border: 4px solid #ffff00;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.1s;
            text-shadow: 2px 2px 0px #000;
            box-shadow: 0 6px 0 #440044, 0 0 20px #ff00ff;
        }

        .question-btn:hover {
            box-shadow: 0 6px 0 #440044, 0 0 30px #ff00ff;
        }

        .question-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #440044, 0 0 20px #ff00ff;
        }

        .question-display {
            background: #1a1a4e;
            padding: 20px;
            border: 4px solid #00ffff;
            min-height: 200px;
            display: none;
            box-shadow: 0 0 20px #00ffff;
        }

        .question-display.active {
            display: block;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-text {
            font-size: 0.7em;
            color: #ffff00;
            margin-bottom: 20px;
            line-height: 1.8;
            text-shadow: 2px 2px 0px #888800;
        }

        .question-type {
            display: inline-block;
            padding: 8px 15px;
            background: #ff0000;
            color: #fff;
            border: 2px solid #880000;
            font-size: 0.5em;
            margin-bottom: 15px;
            text-shadow: 1px 1px 0px #000;
            box-shadow: 0 0 10px #ff0000;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .option {
            padding: 15px;
            background: #000080;
            border: 3px solid #00ff00;
            cursor: pointer;
            transition: all 0.1s;
            font-size: 0.6em;
            color: #fff;
            text-shadow: 1px 1px 0px #000;
            box-shadow: 0 0 10px #00ff00;
        }

        .option:hover {
            background: #0000ff;
            border-color: #ffff00;
            transform: translateX(5px);
            box-shadow: 0 0 20px #ffff00;
        }

        .option:active {
            background: #4444ff;
        }

        .answer-display {
            margin-top: 20px;
            padding: 20px;
            border: 4px solid;
            font-size: 0.6em;
            display: none;
            text-shadow: 2px 2px 0px #000;
            animation: answerPop 0.3s;
        }

        @keyframes answerPop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .answer-display.correct {
            background: #00ff00;
            color: #000;
            border-color: #008800;
            display: block;
            box-shadow: 0 0 20px #00ff00;
        }

        .answer-display.incorrect {
            background: #ff0000;
            color: #fff;
            border-color: #880000;
            display: block;
            box-shadow: 0 0 20px #ff0000;
        }

        .reset-btn {
            margin-top: 20px;
            padding: 15px 25px;
            background: #444;
            color: #fff;
            border: 4px solid #888;
            cursor: pointer;
            font-size: 0.6em;
            font-family: 'Press Start 2P', cursive;
            box-shadow: 0 4px 0 #222;
        }

        .reset-btn:hover {
            background: #666;
        }

        .reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #222;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 0.8em;
            }
            .score-buttons-row {
                grid-template-columns: 1fr;
            }
            .question-text {
                font-size: 0.5em;
            }
        }
    </style>
</head>

    <script>
        let player1Score = 0;
        let player2Score = 0;
        let currentQuestion = null;

        const questions = [
            {

        // Update player names
        document.getElementById('player1Name').addEventListener('change', function() {
            const name = this.value || 'PLAYER 1';

            document.getElementById('p1ScoringTitle').textContent = name + ' SCORING';

            document.getElementById('p2ScoringTitle').textContent = name + ' SCORING';
        });

        function getRandomQuestion() {
            currentQuestion = questions[Math.floor(Math.random() * questions.length)];
            displayQuestion(currentQuestion);
        }

        function displayQuestion(q) {
            const display = document.getElementById('questionDisplay');
            let html = `
                <span class="question-type">MULTIPLE CHOICE</span>
                <div class="question-text">${q.question}</div>
            `;

            html += '<div class="options">';
            q.options.forEach((option, index) => {
                html += `<div class="option" onclick="checkAnswer(${index})">${option}</div>`;
            });
            html += '</div>';

            html += '<div class="answer-display" id="answerDisplay"></div>';
            display.innerHTML = html;
            display.classList.add('active');
        }

        function checkAnswer(selected) {
            const answerDisplay = document.getElementById('answerDisplay');
            const isCorrect = selected === currentQuestion.answer;
            
            answerDisplay.className = 'answer-display ' + (isCorrect ? 'correct' : 'incorrect');
            answerDisplay.textContent = isCorrect ? 
                '✓ CORRECT! AWARD POINTS!' : 
                `✗ WRONG! CORRECT: ${currentQuestion.options[currentQuestion.answer]}`;
        }

        function playVideo(videoFile) {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('cutsceneVideo');
            
            video.src = videoFile;
            modal.classList.add('active');
            
            video.onended = function() {
                modal.classList.remove('active');
                video.src = '';
            };

            // Allow clicking to skip video
            modal.onclick = function() {
                modal.classList.remove('active');
                video.pause();
                video.src = '';
            };
        }

        function scorePoints(player, points) {
            // Play appropriate video
            if (points === 6) {
                playVideo('touchdown.mp4');
            } else if (points === 1) {
                playVideo('extrapointgood.mp4');
            }

            // Update score
            if (player === 1) {
                player1Score += points;
                document.getElementById('player1Score').textContent = player1Score;
            } else {
                player2Score += points;
                document.getElementById('player2Score').textContent = player2Score;
            }

            // Visual feedback
            const scoreElement = document.getElementById(player === 1 ? 'player1Score' : 'player2Score');
            scoreElement.style.transform = 'scale(1.5)';
            scoreElement.style.color = '#ffff00';
            setTimeout(() => {
                scoreElement.style.transform = 'scale(1)';
                scoreElement.style.color = '#00ff00';
            }, 500);
        }

        function resetGame() {
            if (confirm('RESET GAME?')) {
                player1Score = 0;
                player2Score = 0;
                document.getElementById('player1Score').textContent = '0';
                document.getElementById('player2Score').textContent = '0';
                document.getElementById('questionDisplay').classList.remove('active');
            }
        }

        // Add 8-bit sound effect
        function playBeep() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'square';
            gainNode.gain.value = 0.1;
            
            oscillator.start();
            setTimeout(() => oscillator.stop(), 100);
        }

        // Add beep to buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', playBeep);
        });
    </script>
</body>
</html>
